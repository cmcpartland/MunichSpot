# Rebuilds pois.geojson nightly and publishes it to GitHub Pages.
# If build_pois.py or validate_pois.py (which also compares against the live file) fails,
# the build job fails, deploy never runs, and the previous deployment stays live.
# To accept a real, large change, dispatch manually with skip_previous_check.
# places.json is rebuilt weekly (Monday schedule, rebuild_places dispatch, or when it is not live yet).
# Every other run, and any failure of the places build or validation, re-publishes the live file
# (or the bundled one on the first deploy), because each deploy replaces the whole site.
# Places problems never fail the job.
# translations.json (DeepL machine translations of German hours and notes, cached by exact German text)
# is published next to pois.geojson; DeepL problems never fail the build.
# Every run, failed or not, appends one line to history.jsonl on the data-history branch (record job).
# Successful deploys on main ping the HEALTHCHECK_URL check (Healthchecks.io), failures ping /fail; no ping for ~36 h means the job stopped (e.g. GitHub disabled the schedule after 60 days without repo activity).
name: Nightly data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      skip_previous_check:
        description: Skip the comparison with the currently deployed pois.geojson
        type: boolean
        default: false
      rebuild_places:
        description: Rebuild places.json from Overpass (otherwise only on Mondays)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - tools/data/**
      - .github/workflows/nightly-data.yml

permissions:
  contents: read
  pages: write
  id-token: write

env:
  LIVE_PLACES_URL: https://cmcpartland.github.io/MunichSpot/places.json

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_RECORD_DIR: /tmp/run
    outputs:
      pois: ${{ steps.pois.outcome }}
      validate: ${{ steps.validate.outcome }}
      places: ${{ steps.places.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/data/requirements.txt
      - run: pip install -r tools/data/requirements.txt
      - name: Test hours parser
        run: |
          python tools/data/test_hours.py
          python tools/data/test_osm_hours.py
      - name: Build pois
        id: pois
        run: python tools/data/build_pois.py site/pois.geojson
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
      - name: Validate
        id: validate
        run: >
          python tools/data/validate_pois.py site/pois.geojson
          --previous https://cmcpartland.github.io/MunichSpot/pois.geojson
          ${{ inputs.skip_previous_check && '--skip-previous' || '' }}
      - name: Places
        id: places
        continue-on-error: true
        timeout-minutes: 20
        env:
          EVENT: ${{ github.event_name }}
          REBUILD: ${{ inputs.rebuild_places }}
        run: |
          rebuild=false
          [ "$EVENT" = schedule ] && [ "$(date -u +%u)" = 1 ] && rebuild=true
          [ "$EVENT" = workflow_dispatch ] && [ "$REBUILD" = true ] && rebuild=true
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$LIVE_PLACES_URL" || true)
          [ "$code" = 404 ] && rebuild=true
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          if [ "$rebuild" = true ] \
            && python tools/data/build_places.py site/places.new.json \
            && python tools/data/validate_places.py site/places.new.json; then
            mv site/places.new.json site/places.json
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=$rebuild, keeping the live places.json"
          fi
      - name: Reuse the live or bundled places.json
        id: reuse
        if: steps.places.outputs.ok != 'true'
        run: |
          rm -f site/places.new.json
          if curl -fsSL --retry 3 -o site/places.live.json "$LIVE_PLACES_URL" && python tools/data/validate_places.py site/places.live.json; then
            mv site/places.live.json site/places.json
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            rm -f site/places.live.json
            cp shared/src/commonMain/composeResources/files/places.json site/places.json
          fi
      - name: Places summary
        if: always()
        env:
          OUTCOME: ${{ steps.places.outcome }}
          OK: ${{ steps.places.outputs.ok }}
          REBUILD: ${{ steps.places.outputs.rebuild }}
          LIVE: ${{ steps.reuse.outputs.live }}
        run: |
          [ -f site/places.json ] || exit 0
          mkdir -p "$RUN_RECORD_DIR"
          result=not_due
          echo "### places.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" = true ]; then
            msg="rebuilt: $(jq '.places | length' site/places.json) places"
            result=rebuilt
          elif [ "$LIVE" != true ]; then
            msg="live file unusable, published the bundled copy"
            echo "::warning::places.json: $msg"
            echo "places.json: $msg" >> "$RUN_RECORD_DIR/warnings.log"
            result=bundled
          elif [ "$REBUILD" = true ] || [ "$OUTCOME" != success ]; then
            msg="rebuild failed or timed out, re-published the live file (generated $(jq -r .generated site/places.json))"
            echo "::warning::places.json: $msg"
            echo "places.json: $msg" >> "$RUN_RECORD_DIR/warnings.log"
            result=failed
          else
            msg="not due for a rebuild, re-published the live file (generated $(jq -r .generated site/places.json))"
          fi
          echo "- $msg" >> "$GITHUB_STEP_SUMMARY"
          jq -c --arg result "$result" '{result: $result, count: (.places | length), generated}' site/places.json > "$RUN_RECORD_DIR/places.json"
      - name: Write index page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>MunichSpot data</title>
          <h1>MunichSpot data</h1>
          <p>Nightly <a href="pois.geojson">pois.geojson</a> and weekly <a href="places.json">places.json</a> (place search index) and <a href="translations.json">translations.json</a> (English translations of opening hours and notes, machine-translated with DeepL), used by the MunichSpot app.</p>
          <ul>
            <li>Recycling islands: Landeshauptstadt München, AWM, <a href="https://www.govdata.de/dl-de/by-2-0">dl-by-de/2.0</a></li>
            <li>Mailboxes: © OpenStreetMap contributors, <a href="https://www.openstreetmap.org/copyright">ODbL 1.0</a></li>
            <li>Place search index (places.json): © OpenStreetMap contributors, <a href="https://www.openstreetmap.org/copyright">ODbL 1.0</a></li>
          </ul>
          HTML
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-record
          path: ${{ env.RUN_RECORD_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  record:
    needs: [build, deploy]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      EVENT: ${{ github.event_name }}
      SHA: ${{ github.sha }}
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      POIS_OUTCOME: ${{ needs.build.outputs.pois }}
      VALIDATE_OUTCOME: ${{ needs.build.outputs.validate }}
      PLACES_OUTCOME: ${{ needs.build.outputs.places }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: run-record
          path: /tmp/run
      - name: Append to history.jsonl on data-history
        run: |
          mkdir -p /tmp/run history
          cd history
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git config user.name github-actions[bot]
          git config user.email 41898799+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2; do
            if git ls-remote --exit-code --heads origin data-history > /dev/null; then
              git fetch -q --depth 1 origin data-history
              git checkout -q -B data-history FETCH_HEAD
            else
              git checkout -q --orphan data-history
              cat > README.md <<'MD'
          # Run history

          One JSON line per run of the Nightly data workflow, appended to `history.jsonl` by `.github/workflows/nightly-data.yml`. Schema: see "Run history" in `tools/data/README.md` on main.
          MD
            fi
            python ../tools/data/record_run.py /tmp/run history.jsonl
            git add -A
            git commit -q -m "Record run $RUN_NUMBER"
            git push -q origin data-history && break
            [ "$attempt" = 2 ] && exit 1
          done
          echo "Recorded run $RUN_NUMBER in data-history/history.jsonl" >> "$GITHUB_STEP_SUMMARY"

  healthcheck:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Ping Healthchecks.io
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL not set, skipping"
            exit 0
          fi
          url="$HEALTHCHECK_URL"
          [ "$DEPLOY_RESULT" = success ] || url="$HEALTHCHECK_URL/fail"
          curl -fsS -m 10 --retry 5 -o /dev/null --data-raw "deploy: $DEPLOY_RESULT, $RUN_URL" "$url"
